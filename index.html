<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>贪心五子棋</title>
  <style>
    :root { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4efe6;
      color: #2a2a2a;
    }
    .game {
      width: min(95vw, 760px);
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.12);
      padding: 16px;
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
      flex-wrap: wrap;
    }
    .status { font-weight: 600; }
    .controls { display: flex; gap: 8px; }
    button {
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
      background: #1e6fff;
      color: #fff;
    }
    button.secondary { background: #6b7280; }
    #board {
      width: 100%;
      max-width: 680px;
      aspect-ratio: 1;
      border-radius: 10px;
      background: #e5ba73;
      display: block;
      margin: 0 auto;
      touch-action: none;
    }
    .legend {
      margin-top: 10px;
      font-size: 13px;
      color: #4b5563;
    }
  </style>
</head>
<body>
  <section class="game">
    <div class="toolbar">
      <div class="status" id="status">你的回合（黑棋）</div>
      <div class="controls">
        <button id="undo">悔棋</button>
        <button id="restart" class="secondary">重新开始</button>
      </div>
    </div>
    <canvas id="board" width="680" height="680" aria-label="五子棋棋盘"></canvas>
    <div class="legend">规则：你执黑先手，AI 使用贪心策略，优先连成五子并阻挡你的威胁。</div>
  </section>
  <script src="script.js"></script>
</body>
</html>
